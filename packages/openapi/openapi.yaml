openapi: 3.1.0
info:
  title: Yearbook API
  version: 0.1.0
  description: |
    Contract between the Go API and every client. Cookie-authenticated; JSON in snake_case.
    Ids are 22-character base64url strings. Timestamps are RFC 3339 in UTC.
servers:
  - url: /api/v1

security:
  - session: []
  - guest: []
  - {}

tags:
  - name: auth
  - name: events
  - name: uploads
  - name: media
  - name: host
  - name: people
  - name: search
  - name: agent
  - name: albums
  - name: yearbook
  - name: import

paths:
  /health:
    get:
      operationId: getHealth
      tags: [host]
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /auth/magic:
    post:
      operationId: requestMagicLink
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MagicLinkRequest" }
      responses:
        "204": { description: Email sent if the address is valid }
        "429": { $ref: "#/components/responses/Error" }
  /auth/verify:
    post:
      operationId: verifyMagicLink
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyRequest" }
      responses:
        "200":
          description: Session cookie set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyResponse" }
        "400": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "204": { description: Session cleared }

  /me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
    patch:
      operationId: updateMe
      tags: [auth]
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }

  /events:
    get:
      operationId: listEvents
      tags: [events]
      security: [{ session: [] }]
      responses:
        "200":
          description: Events the user owns or is a member of
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventList" }
    post:
      operationId: createEvent
      tags: [events]
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/Error" }

  /events/{slug}:
    parameters: [{ $ref: "#/components/parameters/Slug" }]
    get:
      operationId: getEvent
      tags: [events]
      responses:
        "200":
          description: Event with viewer context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateEvent
      tags: [events]
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
    delete:
      operationId: deleteEvent
      tags: [events]
      security: [{ session: [] }]
      responses:
        "204": { description: Deleted }

  /events/{slug}/qr.svg:
    parameters: [{ $ref: "#/components/parameters/Slug" }]
    get:
      operationId: getEventQr
      tags: [events]
      responses:
        "200":
          description: QR code pointing at the public event URL
          content:
            image/svg+xml:
              schema: { type: string }

  /events/{slug}/status:
    parameters: [{ $ref: "#/components/parameters/Slug" }]
    get:
      operationId: getEventStatus
      tags: [events]
      responses:
        "200":
          description: Processing counters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventStatus" }

  /events/{slug}/events:
    parameters: [{ $ref: "#/components/parameters/Slug" }]
    get:
      operationId: streamEventUpdates
      tags: [events]
      description: |
        Server-Sent Events. Event names: media.queued, media.ready, media.failed, media.removed,
        like.changed, people.updated. Each has an id; Last-Event-ID replays up to 200 events.
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema: { type: string }

  /events/{slug}/guests:
    parameters: [{ $ref: "#/components/parameters/Slug" }]
    post:
      operationId: ensureGuest
      tags: [events]
      description: Idempotent. Creates the guest cookie and the per-event guest row if missing.
      responses:
        "200":
          description: Guest identity for this event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Guest" }
  /events/{slug}/guests/me:
    parameters: [{ $ref: "#/components/parameters/Slug" }]
    patch:
      operationId: updateGuest
      tags: [events]
      security: [{ guest: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuestUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Guest" }

  /events/{slug}/uploads:
    parameters: [{ $ref: "#/components/parameters/Slug" }]
    post:
      operationId: createUploads
      tags: [uploads]
      description: Creates upload intents for up to 20 files and returns presigned URLs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadIntentRequest" }
      responses:
        "200":
          description: One entry per file, in request order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadIntentResponse" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
    get:
      operationId: listEventUploads
      tags: [host]
      security: [{ session: [] }]
      responses:
        "200":
          description: Per-uploader review for hosts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostUploads" }

  /uploads/{media_id}:
    parameters: [{ $ref: "#/components/parameters/MediaId" }]
    get:
      operationId: getUploadStatus
      tags: [uploads]
      responses:
        "200":
          description: Parts already received and fresh URLs for the rest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadStatus" }
    delete:
      operationId: abortUpload
      tags: [uploads]
      responses:
        "204": { description: Aborted and removed }
  /uploads/{media_id}/complete:
    parameters: [{ $ref: "#/components/parameters/MediaId" }]
    post:
      operationId: completeUpload
      tags: [uploads]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadComplete" }
      responses:
        "200":
          description: Media queued for processing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GridItem" }
        "409": { $ref: "#/components/responses/Error" }

  /events/{slug}/media:
    parameters: [{ $ref: "#/components/parameters/Slug" }]
    get:
      operationId: listEventMedia
      tags: [media]
      parameters:
        - name: filter
          in: query
          description: all | best | videos | mine | me | person:{id} | album:{id} | library
          schema: { type: string, default: all }
        - name: age_min
          in: query
          schema: { type: integer, minimum: 0 }
        - name: age_max
          in: query
          schema: { type: integer, minimum: 0 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 60 }
      responses:
        "200":
          description: A page of grid items, newest capture first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaPage" }

  /media/{media_id}:
    parameters: [{ $ref: "#/components/parameters/MediaId" }]
    get:
      operationId: getMedia
      tags: [media]
      responses:
        "200":
          description: One item with detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaDetail" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMedia
      tags: [media]
      description: Uploader within 7 days from the same browser, or a host.
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Error" }

  /media/{media_id}/original:
    parameters: [{ $ref: "#/components/parameters/MediaId" }]
    get:
      operationId: downloadOriginal
      tags: [media]
      responses:
        "302": { description: Redirect to a short-lived download URL }

  /media/{media_id}/like:
    parameters: [{ $ref: "#/components/parameters/MediaId" }]
    put:
      operationId: likeMedia
      tags: [media]
      responses:
        "200":
          description: Liked (idempotent)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LikeResult" }
    delete:
      operationId: unlikeMedia
      tags: [media]
      responses:
        "200":
          description: Unliked (idempotent)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LikeResult" }

  /media/{media_id}/retry:
    parameters: [{ $ref: "#/components/parameters/MediaId" }]
    post:
      operationId: retryMedia
      tags: [host]
      security: [{ session: [] }]
      responses:
        "204": { description: Re-queued }

  /media/zip:
    post:
      operationId: createZip
      tags: [media]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZipRequest" }
      responses:
        "200":
          description: A short-lived download URL that streams a zip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZipTicket" }
  /zips/{token}:
    get:
      operationId: downloadZip
      tags: [media]
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Zip stream
          content:
            application/zip:
              schema: { type: string, format: binary }

  # ---------------------------------------------------------------- people
  /events/{slug}/people:
    parameters: [{ $ref: "#/components/parameters/Slug" }]
    get:
      operationId: listPeople
      tags: [people]
      responses:
        "200":
          description: Face clusters of the event, biggest first; hidden persons omitted unless they are the viewer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeopleList" }
  /people/{person_id}:
    parameters: [{ $ref: "#/components/parameters/PersonId" }]
    get:
      operationId: getPerson
      tags: [people]
      responses:
        "200":
          description: One person
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
    patch:
      operationId: updatePerson
      tags: [people]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
  /people/{person_id}/claim:
    parameters: [{ $ref: "#/components/parameters/PersonId" }]
    post:
      operationId: claimPerson
      tags: [people]
      description: Links the person to the caller's identity ("This is me"). Guests get an identity tied to their cookie.
      responses:
        "200":
          description: Linked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
    delete:
      operationId: unclaimPerson
      tags: [people]
      responses:
        "200":
          description: Unlinked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
  /people/merge:
    post:
      operationId: mergePeople
      tags: [people]
      description: Host, or the claimant for persons that are them. Keeps the first id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [person_ids]
              properties:
                person_ids:
                  type: array
                  minItems: 2
                  items: { $ref: "#/components/schemas/Id" }
      responses:
        "200":
          description: The surviving person
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
  /people/{person_id}/split:
    parameters: [{ $ref: "#/components/parameters/PersonId" }]
    post:
      operationId: splitPerson
      tags: [people]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [face_ids]
              properties:
                face_ids:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/Id" }
      responses:
        "200":
          description: The new person made of the given faces
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
  /faces/{face_id}/not-person:
    parameters: [{ $ref: "#/components/parameters/FaceId" }]
    post:
      operationId: faceNotPerson
      tags: [people]
      description: Marks the face as wrongly assigned; records a cannot-link constraint and reclusters.
      responses:
        "204": { description: Recorded }
  /faces/{face_id}/crop.jpg:
    parameters: [{ $ref: "#/components/parameters/FaceId" }]
    get:
      operationId: getFaceCrop
      tags: [people]
      responses:
        "200":
          description: Private face crop, served through the API
          content:
            image/jpeg:
              schema: { type: string, format: binary }
  /media/{media_id}/faces:
    parameters: [{ $ref: "#/components/parameters/MediaId" }]
    get:
      operationId: listMediaFaces
      tags: [people]
      responses:
        "200":
          description: Faces in one item with boxes and persons
          content:
            application/json:
              schema:
                type: object
                required: [faces]
                properties:
                  faces:
                    type: array
                    items: { $ref: "#/components/schemas/Face" }
  /me/people:
    get:
      operationId: listMyPeople
      tags: [people]
      security: [{ session: [] }]
      responses:
        "200":
          description: Persons linked to my identity, across events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeopleList" }
  /me/suggestions:
    get:
      operationId: listMySuggestions
      tags: [people]
      security: [{ session: [] }]
      responses:
        "200":
          description: Unclaimed persons in my events that are probably me
          content:
            application/json:
              schema:
                type: object
                required: [suggestions]
                properties:
                  suggestions:
                    type: array
                    items: { $ref: "#/components/schemas/Suggestion" }
  /me/face-data:
    delete:
      operationId: deleteMyFaceData
      tags: [people]
      security: [{ session: [] }]
      description: Removes identity links and the faces of linked persons. Photos stay.
      responses:
        "204": { description: Deleted }

  # ---------------------------------------------------------------- search and agent
  /events/{slug}/search:
    parameters: [{ $ref: "#/components/parameters/Slug" }]
    get:
      operationId: searchEventMedia
      tags: [search]
      description: Hybrid text search without the language model (vector + full text + tags).
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 60 } }
      responses:
        "200":
          description: Matching items, best match first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaPage" }
  /search:
    get:
      operationId: searchMyMedia
      tags: [search]
      security: [{ session: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 60 } }
      responses:
        "200":
          description: Matching items across my events and library
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaPage" }
  /agent/messages:
    post:
      operationId: sendAgentMessage
      tags: [agent]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentRequest" }
      responses:
        "200":
          description: A structured result the UI renders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentResponse" }
        "503": { $ref: "#/components/responses/Error" }
  /agent/commands:
    get:
      operationId: listSavedCommands
      tags: [agent]
      parameters:
        - { name: event_slug, in: query, schema: { type: string } }
      responses:
        "200":
          description: Saved commands visible in this scope
          content:
            application/json:
              schema:
                type: object
                required: [commands]
                properties:
                  commands:
                    type: array
                    items: { $ref: "#/components/schemas/SavedCommand" }
    post:
      operationId: saveCommand
      tags: [agent]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [turn_id, label]
              properties:
                turn_id: { $ref: "#/components/schemas/Id" }
                label: { type: string, minLength: 1, maxLength: 30 }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedCommand" }
  /agent/commands/{command_id}:
    parameters:
      - { name: command_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    delete:
      operationId: deleteSavedCommand
      tags: [agent]
      responses:
        "204": { description: Deleted }
  /agent/commands/{command_id}/run:
    parameters:
      - { name: command_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    post:
      operationId: runSavedCommand
      tags: [agent]
      description: Runs a saved command with no language model call.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                event_slug: { type: string }
                params: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentResponse" }
  /media/{media_id}/describe:
    parameters: [{ $ref: "#/components/parameters/MediaId" }]
    post:
      operationId: describeMedia
      tags: [agent]
      description: User-initiated. Sends this one image to the vision model and returns a description.
      responses:
        "200":
          description: Description
          content:
            application/json:
              schema:
                type: object
                required: [text]
                properties:
                  text: { type: string }
        "503": { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- albums, highlights, shares
  /events/{slug}/best:
    parameters: [{ $ref: "#/components/parameters/Slug" }]
    get:
      operationId: listEventHighlights
      tags: [media]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 24 } }
      responses:
        "200":
          description: Auto-picked best photos, diverse across time, one per burst
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaPage" }
  /events/{slug}/albums:
    parameters: [{ $ref: "#/components/parameters/Slug" }]
    get:
      operationId: listEventAlbums
      tags: [albums]
      responses:
        "200":
          description: Albums of the event the viewer may see
          content:
            application/json:
              schema:
                type: object
                required: [albums]
                properties:
                  albums:
                    type: array
                    items: { $ref: "#/components/schemas/Album" }
  /albums:
    post:
      operationId: createAlbum
      tags: [albums]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlbumCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Album" }
  /albums/{album_id}:
    parameters: [{ $ref: "#/components/parameters/AlbumId" }]
    get:
      operationId: getAlbum
      tags: [albums]
      responses:
        "200":
          description: Album with items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlbumDetail" }
    patch:
      operationId: updateAlbum
      tags: [albums]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlbumUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlbumDetail" }
    delete:
      operationId: deleteAlbum
      tags: [albums]
      responses:
        "204": { description: Deleted }
  /albums/{album_id}/share:
    parameters: [{ $ref: "#/components/parameters/AlbumId" }]
    post:
      operationId: shareAlbum
      tags: [albums]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_days: { type: integer, minimum: 1, maximum: 365 }
                allow_download: { type: boolean, default: true }
      responses:
        "201":
          description: Share link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Share" }
  /s/{share_id}:
    parameters:
      - { name: share_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    get:
      operationId: getSharedAlbum
      tags: [albums]
      security: []
      responses:
        "200":
          description: Read-only album for anyone with the link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlbumDetail" }
        "404": { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- yearbook
  /me/years:
    get:
      operationId: listMyYears
      tags: [yearbook]
      security: [{ session: [] }]
      responses:
        "200":
          description: Years with the events I appear in
          content:
            application/json:
              schema:
                type: object
                required: [years]
                properties:
                  years:
                    type: array
                    items: { $ref: "#/components/schemas/YearSummary" }
  /me/years/{year}:
    parameters:
      - { name: year, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getMyYear
      tags: [yearbook]
      security: [{ session: [] }]
      responses:
        "200":
          description: Recap of one year
          content:
            application/json:
              schema: { $ref: "#/components/schemas/YearRecap" }

  # ---------------------------------------------------------------- import
  /imports:
    get:
      operationId: listImports
      tags: [import]
      security: [{ session: [] }]
      responses:
        "200":
          description: My imports, newest first
          content:
            application/json:
              schema:
                type: object
                required: [imports]
                properties:
                  imports:
                    type: array
                    items: { $ref: "#/components/schemas/Import" }
    post:
      operationId: createImport
      tags: [import]
      security: [{ session: [] }]
      description: Starts an import. For zip and takeout the response carries presigned multipart URLs for the archive.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportCreate" }
      responses:
        "201":
          description: Import created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportInit" }
  /imports/{import_id}:
    parameters: [{ $ref: "#/components/parameters/ImportId" }]
    get:
      operationId: getImport
      tags: [import]
      security: [{ session: [] }]
      responses:
        "200":
          description: Import status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Import" }
    delete:
      operationId: cancelImport
      tags: [import]
      security: [{ session: [] }]
      responses:
        "204": { description: Cancelled }
  /imports/{import_id}/complete:
    parameters: [{ $ref: "#/components/parameters/ImportId" }]
    post:
      operationId: completeImport
      tags: [import]
      security: [{ session: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadComplete" }
      responses:
        "200":
          description: Archive received, processing queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Import" }
  /me/library:
    get:
      operationId: listMyLibrary
      tags: [import]
      security: [{ session: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 60 } }
        - { name: unassigned, in: query, schema: { type: boolean, default: false }, description: Only items not matched to an event }
      responses:
        "200":
          description: My personal library (imports and uploads without an event)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaPage" }
  /media/{media_id}/event:
    parameters: [{ $ref: "#/components/parameters/MediaId" }]
    put:
      operationId: assignMediaEvent
      tags: [import]
      security: [{ session: [] }]
      description: Moves a library item into one of my events, or out of it with event_slug null.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_slug: { type: [string, "null"] }
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GridItem" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: yb_session
    guest:
      type: apiKey
      in: cookie
      name: yb_guest

  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    MediaId:
      name: media_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    PersonId:
      name: person_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    FaceId:
      name: face_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    AlbumId:
      name: album_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    ImportId:
      name: import_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    Id:
      type: string
      minLength: 22
      maxLength: 22
      description: 16 random bytes, base64url without padding

    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [bad_request, unauthorized, forbidden, not_found, conflict, too_large, unsupported_media, rate_limited, internal]
            message: { type: string }
            details: { type: object, additionalProperties: true }

    MagicLinkRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        locale: { type: string, enum: [de, en, tr] }
        next: { type: string, description: Path on the web origin to return to }
    VerifyRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    VerifyResponse:
      type: object
      required: [next, me]
      properties:
        next: { type: string }
        me: { $ref: "#/components/schemas/Me" }

    Me:
      type: object
      required: [authenticated, locale]
      properties:
        authenticated: { type: boolean }
        id: { $ref: "#/components/schemas/Id" }
        email: { type: string }
        display_name: { type: string }
        birthdate: { type: string, format: date }
        locale: { type: string, enum: [de, en, tr] }
        link_across: { type: boolean }
        hide_from_people: { type: boolean }
        has_claimed_person: { type: boolean }
    MeUpdate:
      type: object
      properties:
        display_name: { type: string, minLength: 1, maxLength: 80 }
        birthdate: { type: string, format: date }
        clear_birthdate: { type: boolean, description: Remove the stored birthdate }
        locale: { type: string, enum: [de, en, tr] }
        link_across: { type: boolean, description: Allow cross-event face suggestions }
        hide_from_people: { type: boolean, description: Hide my linked persons from People tabs }

    Viewer:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [anonymous, guest, member, host, owner] }
        guest_id: { $ref: "#/components/schemas/Id" }
        display_name: { type: string }
    Guest:
      type: object
      required: [guest_id]
      properties:
        guest_id: { $ref: "#/components/schemas/Id" }
        display_name: { type: string }
    GuestUpdate:
      type: object
      required: [display_name]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 80 }

    EventCounts:
      type: object
      required: [photos, videos, ready, processing, failed]
      properties:
        photos: { type: integer }
        videos: { type: integer }
        ready: { type: integer }
        processing: { type: integer }
        failed: { type: integer }
        of_you: { type: integer, description: Photos the viewer appears in, once claimed }
        people: { type: integer }
        faces_done: { type: integer, description: Media items that finished face analysis }
    Event:
      type: object
      required: [id, slug, title, starts_at, timezone, guest_upload, guest_view, host, counts, viewer, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        slug: { type: string }
        title: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
        timezone: { type: string }
        location: { type: [string, "null"] }
        cover: { $ref: "#/components/schemas/Variants" }
        host:
          type: object
          required: [display_name]
          properties:
            display_name: { type: string }
        guest_upload: { type: boolean }
        guest_view: { type: boolean }
        faces_enabled: { type: boolean }
        clustered_at: { type: [string, "null"], format: date-time }
        counts: { $ref: "#/components/schemas/EventCounts" }
        viewer: { $ref: "#/components/schemas/Viewer" }
        created_at: { type: string, format: date-time }
    EventCreate:
      type: object
      required: [title, starts_at]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        timezone: { type: string, default: Europe/Berlin }
        location: { type: string, maxLength: 200 }
    EventUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
        timezone: { type: string }
        location: { type: [string, "null"], maxLength: 200 }
        cover_media_id: { $ref: "#/components/schemas/Id" }
        guest_upload: { type: boolean }
        guest_view: { type: boolean }
        faces_enabled: { type: boolean }
    EventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Event" }
    EventStatus:
      type: object
      required: [total, ready, processing, failed]
      properties:
        total: { type: integer }
        ready: { type: integer }
        processing: { type: integer }
        failed: { type: integer }
        faces_done: { type: integer }
        clustered_at: { type: [string, "null"], format: date-time }

    UploadFile:
      type: object
      required: [client_id, name, size, type]
      properties:
        client_id: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        size: { type: integer, minimum: 1 }
        type: { type: string, description: MIME type as reported by the browser }
        last_modified: { type: string, format: date-time }
        sha256: { type: string, description: Hex SHA-256 of the whole file, if the client computed it }
    UploadIntentRequest:
      type: object
      required: [files]
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/UploadFile" }
    UploadPart:
      type: object
      required: [part_number, url]
      properties:
        part_number: { type: integer, minimum: 1 }
        url: { type: string }
    UploadInit:
      type: object
      required: [client_id, media_id, mode, expires_at]
      properties:
        client_id: { type: string }
        media_id: { $ref: "#/components/schemas/Id" }
        mode: { type: string, enum: [single, multipart, duplicate] }
        url: { type: string, description: Presigned PUT URL when mode is single }
        headers:
          type: object
          additionalProperties: { type: string }
          description: Headers the client must send with the PUT
        parts:
          type: array
          items: { $ref: "#/components/schemas/UploadPart" }
        part_size: { type: integer }
        expires_at: { type: string, format: date-time }
        duplicate_of: { $ref: "#/components/schemas/Id" }
        item: { $ref: "#/components/schemas/GridItem", description: The existing item when mode is duplicate }
    UploadIntentResponse:
      type: object
      required: [uploads]
      properties:
        uploads:
          type: array
          items: { $ref: "#/components/schemas/UploadInit" }
    UploadStatus:
      type: object
      required: [media_id, mode, received_parts, parts, expires_at]
      properties:
        media_id: { $ref: "#/components/schemas/Id" }
        mode: { type: string, enum: [single, multipart] }
        url: { type: string }
        received_parts:
          type: array
          items: { type: integer }
        parts:
          type: array
          items: { $ref: "#/components/schemas/UploadPart" }
        part_size: { type: integer }
        expires_at: { type: string, format: date-time }
    CompletedPart:
      type: object
      required: [part_number, etag]
      properties:
        part_number: { type: integer }
        etag: { type: string }
    UploadComplete:
      type: object
      properties:
        parts:
          type: array
          items: { $ref: "#/components/schemas/CompletedPart" }

    Variants:
      type: object
      description: Public CDN URLs by size. Absent while processing.
      properties:
        thumb: { type: string, description: 256 px square }
        small: { type: string, description: 640 px long edge }
        medium: { type: string, description: 1280 px long edge }
        large: { type: string, description: 2048 px long edge }
    GridItem:
      type: object
      required: [id, kind, state, width, height, like_count, liked, me, person_ids, processing]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        kind: { type: string, enum: [photo, video] }
        state: { type: string, enum: [uploading, queued, processing, ready, failed, removed] }
        captured_at: { type: [string, "null"], format: date-time }
        captured_src: { type: [string, "null"], enum: [exif, filename, upload, sidecar, null] }
        width: { type: integer }
        height: { type: integer }
        duration_ms: { type: [integer, "null"] }
        variants: { $ref: "#/components/schemas/Variants" }
        poster: { type: string }
        video_url: { type: string }
        like_count: { type: integer }
        liked: { type: boolean }
        me: { type: boolean, description: The viewer appears in this item }
        mine: { type: boolean, description: The viewer uploaded this item }
        person_ids:
          type: array
          items: { $ref: "#/components/schemas/Id" }
        score: { type: [number, "null"] }
        processing: { type: boolean }
        analyzed: { type: boolean, description: Faces, embedding and quality are done }
    MediaGroup:
      type: object
      required: [label, start, end, count]
      properties:
        label: { type: string, description: Localized later by the client from start/end; server sends a key like evening }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        count: { type: integer }
    MediaPage:
      type: object
      required: [items, groups]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GridItem" }
        next_cursor: { type: [string, "null"] }
        groups:
          type: array
          items: { $ref: "#/components/schemas/MediaGroup" }
    MediaDetail:
      allOf:
        - $ref: "#/components/schemas/GridItem"
        - type: object
          required: [uploader, can_delete]
          properties:
            uploader:
              type: object
              properties:
                display_name: { type: string }
                is_you: { type: boolean }
            original_filename: { type: [string, "null"] }
            place_name: { type: [string, "null"] }
            can_delete: { type: boolean }
    LikeResult:
      type: object
      required: [media_id, like_count, liked]
      properties:
        media_id: { $ref: "#/components/schemas/Id" }
        like_count: { type: integer }
        liked: { type: boolean }

    ZipRequest:
      type: object
      required: [media_ids]
      properties:
        media_ids:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/Id" }
        originals: { type: boolean, default: true }
    ZipTicket:
      type: object
      required: [url, expires_at, count]
      properties:
        url: { type: string }
        expires_at: { type: string, format: date-time }
        count: { type: integer }

    HostUploadItem:
      type: object
      required: [id, kind, state]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        kind: { type: string, enum: [photo, video] }
        state: { type: string, enum: [uploading, queued, processing, ready, failed, removed] }
        thumb: { type: string }
        name: { type: [string, "null"], description: Original filename }
        size: { type: [integer, "null"], description: Original bytes }
        error: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    HostUploader:
      type: object
      required: [display_name, is_you, total, ready, failed, items]
      properties:
        guest_id: { $ref: "#/components/schemas/Id" }
        display_name: { type: string }
        is_you: { type: boolean }
        total: { type: integer }
        ready: { type: integer }
        failed: { type: integer }
        last_upload_at: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/HostUploadItem" }
    HostUploads:
      type: object
      required: [uploaders, status]
      properties:
        uploaders:
          type: array
          items: { $ref: "#/components/schemas/HostUploader" }
        status: { $ref: "#/components/schemas/EventStatus" }

    # ---------------------------------------------------------------- people
    Person:
      type: object
      required: [id, event_slug, face_count, is_me, named, hidden]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        event_slug: { type: string }
        display_name: { type: [string, "null"] }
        named: { type: boolean }
        crop_url: { type: string, description: "Crop URL of the cover face, served by the API" }
        face_count: { type: integer }
        media_count: { type: integer }
        is_me: { type: boolean }
        suggested_me: { type: boolean, description: Heuristic guess that this is the viewer }
        linked: { type: boolean, description: Linked to any identity }
        hidden: { type: boolean }
        can_edit: { type: boolean }
    PersonUpdate:
      type: object
      properties:
        display_name: { type: [string, "null"], maxLength: 80 }
        hidden: { type: boolean }
    PeopleList:
      type: object
      required: [persons]
      properties:
        persons:
          type: array
          items: { $ref: "#/components/schemas/Person" }
        unnamed_count: { type: integer }
        analyzing: { type: boolean, description: Face analysis still running for some items }
    Face:
      type: object
      required: [id, media_id, bbox]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        media_id: { $ref: "#/components/schemas/Id" }
        person_id: { $ref: "#/components/schemas/Id" }
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: integer }
          description: x, y, w, h in original pixels
        crop_url: { type: string }
        age_est: { type: [number, "null"] }
        quality: { type: [number, "null"] }
    Suggestion:
      type: object
      required: [person, event_title, confidence]
      properties:
        person: { $ref: "#/components/schemas/Person" }
        event_title: { type: string }
        event_starts_at: { type: string, format: date-time }
        confidence: { type: number }

    # ---------------------------------------------------------------- agent
    AgentRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 500 }
        event_slug: { type: string, description: Scope to one event; omitted = all my events and library }
        conversation_id: { $ref: "#/components/schemas/Id" }
    Chip:
      type: object
      required: [label, text]
      properties:
        label: { type: string }
        text: { type: string, description: The message to send when tapped }
        command_id: { $ref: "#/components/schemas/Id" }
    AgentResult:
      oneOf:
        - type: object
          required: [kind, title, media_ids]
          properties:
            kind: { type: string, enum: [media] }
            title: { type: string }
            media_ids:
              type: array
              items: { $ref: "#/components/schemas/Id" }
            items:
              type: array
              items: { $ref: "#/components/schemas/GridItem" }
            group_by: { type: string, enum: [time, person, none] }
        - type: object
          required: [kind, title, persons]
          properties:
            kind: { type: string, enum: [people] }
            title: { type: string }
            persons:
              type: array
              items: { $ref: "#/components/schemas/Person" }
        - type: object
          required: [kind, title, value]
          properties:
            kind: { type: string, enum: [stat] }
            title: { type: string }
            value: { type: string }
            detail: { type: string }
            items:
              type: array
              items: { $ref: "#/components/schemas/GridItem" }
        - type: object
          required: [kind, album]
          properties:
            kind: { type: string, enum: [album] }
            album: { $ref: "#/components/schemas/Album" }
        - type: object
          required: [kind, question, options]
          properties:
            kind: { type: string, enum: [clarify] }
            question: { type: string }
            options:
              type: array
              items: { type: string }
        - type: object
          required: [kind, title]
          properties:
            kind: { type: string, enum: [empty] }
            title: { type: string }
      discriminator:
        propertyName: kind
    AgentResponse:
      type: object
      required: [conversation_id, turn_id, understood, result, suggestions, saveable]
      properties:
        conversation_id: { $ref: "#/components/schemas/Id" }
        turn_id: { $ref: "#/components/schemas/Id" }
        understood: { type: string }
        result: { $ref: "#/components/schemas/AgentResult" }
        suggestions:
          type: array
          items: { $ref: "#/components/schemas/Chip" }
        saveable: { type: boolean }
        attachments:
          type: array
          description: Files the agent produced in the sandbox (charts, collages); short-lived URLs
          items: { $ref: "#/components/schemas/Attachment" }
    Attachment:
      type: object
      required: [name, url, mime]
      properties:
        name: { type: string }
        url: { type: string }
        mime: { type: string }
        width: { type: integer }
        height: { type: integer }
    SavedCommand:
      type: object
      required: [id, name, label, description, params, scope]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        label: { type: string }
        description: { type: string }
        scope: { type: string, enum: [event, global] }
        event_slug: { type: string }
        params: { type: object, additionalProperties: true, description: JSON schema of parameters }
        shared: { type: boolean, description: Approved by the host for every guest of the event }
        kind: { type: string, enum: [sql, search, python], description: python tools run only in the sandbox }
        created_by_agent: { type: boolean }
        run_count: { type: integer }

    # ---------------------------------------------------------------- albums
    Album:
      type: object
      required: [id, title, kind, count]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        event_slug: { type: string }
        title: { type: string }
        kind: { type: string, enum: [highlights, manual, agent] }
        count: { type: integer }
        cover: { $ref: "#/components/schemas/Variants" }
        can_edit: { type: boolean }
    AlbumCreate:
      type: object
      required: [title, media_ids]
      properties:
        event_slug: { type: string }
        title: { type: string, minLength: 1, maxLength: 120 }
        media_ids:
          type: array
          items: { $ref: "#/components/schemas/Id" }
    AlbumUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        add:
          type: array
          items: { $ref: "#/components/schemas/Id" }
        remove:
          type: array
          items: { $ref: "#/components/schemas/Id" }
    AlbumDetail:
      allOf:
        - $ref: "#/components/schemas/Album"
        - type: object
          required: [items, allow_download]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/GridItem" }
            allow_download: { type: boolean }
            event_title: { type: string }
    Share:
      type: object
      required: [share_id, url, allow_download]
      properties:
        share_id: { $ref: "#/components/schemas/Id" }
        url: { type: string }
        expires_at: { type: [string, "null"], format: date-time }
        allow_download: { type: boolean }

    # ---------------------------------------------------------------- yearbook
    EventSummary:
      type: object
      required: [slug, title, starts_at, photos, of_you]
      properties:
        slug: { type: string }
        title: { type: string }
        starts_at: { type: string, format: date-time }
        photos: { type: integer }
        of_you: { type: integer }
        cover: { $ref: "#/components/schemas/Variants" }
        of_you_items:
          type: array
          items: { $ref: "#/components/schemas/GridItem" }
          description: Up to 4 best photos of the viewer in this event, for the fanned stack
        analyzing: { type: boolean }
    YearSummary:
      type: object
      required: [year, events, moments]
      properties:
        year: { type: integer }
        moments: { type: integer, description: Photos of you this year }
        events:
          type: array
          items: { $ref: "#/components/schemas/EventSummary" }
    TopPerson:
      type: object
      required: [display_name, count]
      properties:
        person_id: { $ref: "#/components/schemas/Id" }
        display_name: { type: string }
        count: { type: integer }
        crop_url: { type: string }
    YearRecap:
      type: object
      required: [year, moments, events, best_of_you, top_people]
      properties:
        year: { type: integer }
        moments: { type: integer }
        events:
          type: array
          items: { $ref: "#/components/schemas/EventSummary" }
        best_of_you:
          type: array
          items: { $ref: "#/components/schemas/GridItem" }
        top_people:
          type: array
          items: { $ref: "#/components/schemas/TopPerson" }
        portrait: { $ref: "#/components/schemas/GridItem" }

    # ---------------------------------------------------------------- import
    ImportCreate:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [takeout, zip, folder] }
        event_slug: { type: string, description: Put everything into this event instead of matching by time }
        filename: { type: string }
        size: { type: integer, minimum: 1 }
        path: { type: string, description: Server-side directory, CLI and operators only }
    ImportInit:
      allOf:
        - $ref: "#/components/schemas/Import"
        - type: object
          properties:
            upload: { $ref: "#/components/schemas/UploadInit" }
    Import:
      type: object
      required: [id, kind, state, created_at, stats]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        kind: { type: string, enum: [takeout, zip, folder] }
        state: { type: string, enum: [uploading, queued, running, done, failed, cancelled] }
        event_slug: { type: string }
        stats:
          type: object
          required: [found, imported, duplicates, failed, matched]
          properties:
            found: { type: integer }
            imported: { type: integer }
            duplicates: { type: integer }
            failed: { type: integer }
            matched: { type: integer, description: Items auto-assigned to an event by time }
            people_seeded: { type: integer, description: Takeout people names applied }
        error: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
