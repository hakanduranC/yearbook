# oapi-codegen configuration. Regenerate with `go generate ./...` (see internal/gen/api/gen.go).
package: api
output: internal/gen/api/api.gen.go
generate:
  chi-server: true
  strict-server: true
  models: true
  embedded-spec: true
output-options:
  skip-prune: false
  # AgentResult is a oneOf with an inline discriminator the generator cannot map; it is defined by
  # hand in internal/gen/api/agent_result.go with the same JSON shape.
  exclude-schemas: [AgentResult]
