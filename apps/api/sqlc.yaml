# sqlc configuration. Regenerate with `sqlc generate` (also part of `mise run gen`).
version: "2"
sql:
  - engine: postgresql
    schema: ../../infra/migrations
    queries: internal/db/queries
    gen:
      go:
        package: db
        out: internal/gen/db
        sql_package: pgx/v5
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "date"
            go_type: "time.Time"
          - db_type: "date"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
