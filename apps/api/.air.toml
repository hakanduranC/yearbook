# Hot reload for `mise run api`: rebuilds and restarts cmd/api on any Go or SQL change.
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/api ./cmd/api"
bin = "./tmp/api"
include_ext = ["go", "sql", "yaml"]
exclude_dir = ["tmp", "bin"]
exclude_regex = ["_test\\.go$"]
delay = 300
kill_delay = "2s"
send_interrupt = true

[log]
time = false

[misc]
clean_on_exit = true
