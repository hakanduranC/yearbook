[project]
name = "yearbook-sandbox"
version = "0.1.0"
description = "Yearbook sandbox execution service: runs agent-written Python in throwaway, network-less containers. The only component allowed to talk to Docker."
requires-python = "==3.12.*"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "docker>=7.1",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
]

[project.scripts]
yearbook-sandbox = "yearbook_sandbox.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yearbook_sandbox"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: starts real containers through the Docker socket (needs yearbook-sandbox:latest)"]
