[project]
name = "yearbook-worker"
version = "0.1.0"
description = "Yearbook ingestion worker: claims jobs from Postgres, produces variants, hashes and duplicate groups."
requires-python = "==3.12.*"
dependencies = [
  "psycopg[binary,pool]>=3.2,<4",
  "boto3>=1.35",
  "pillow>=11",
  "pillow-heif>=0.20",
  "ImageHash>=4.3",
  "numpy>=2",
  "pydantic-settings>=2.6",
  "structlog>=24",
  # ML (round 2): faces, embeddings, tags, age, clustering, ML server
  "insightface>=2.1",
  "onnxruntime>=1.20",
  "opencv-python-headless>=4.10",
  "torch>=2.5",
  "torchvision>=0.20",
  "transformers>=5.0",
  "timm>=1.0.15",
  "huggingface-hub>=0.30",
  "safetensors>=0.4",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pgvector>=0.5.1",
]

[project.scripts]
yearbook-worker = "yearbook_worker.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8",
  "ruff>=0.8",
  "watchfiles>=1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yearbook_worker"]

[tool.uv]
# insightface pins the GUI build of OpenCV; the headless wheel provides the same `cv2` module
# and needs no libGL in the container, so the GUI build is overridden away.
override-dependencies = ["opencv-python; python_version < '0'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"fixtures/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Postgres and S3", "ml: loads the real models (slow, downloads on first run)"]
