[project]
name = "yearbook-agent"
version = "0.1.0"
description = "Yearbook chat agent: a LangGraph loop over the API's MCP tools, called only by the Go API."
requires-python = "==3.12.*"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "psycopg[binary,pool]>=3.2,<4",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3.0",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langchain-mcp-adapters>=0.2",
  "mcp>=1.10",
  "openai>=1.60",
  "boto3>=1.35",
  "pyyaml>=6",
  "structlog>=24",
  "typer>=0.12",
]

[project.scripts]
yearbook-agent = "yearbook_agent.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yearbook_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]
allowed-confusables = ["ı", "İ", "ş", "ğ", "ç", "ö", "ü", "’", "“", "”", "„"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: needs Postgres (TEST_DATABASE_URL)"]
