- locale: en
  scope: event
  user: who did I spend the most time with?
  steps:
    - tool: run_query
      args:
        sql: >-
          select p.id, p.display_name, count(distinct f.media_id) as n
          from v_faces f join v_persons p on p.id = f.person_id
          where f.media_id in (select f2.media_id from v_faces f2 join v_persons p2 on p2.id = f2.person_id where p2.is_me)
            and not p.is_me
          group by p.id, p.display_name order by n desc limit 5
    - tool: present
      args:
        understood: Who appears with you most often
        result:
          kind: people
          title: Most often with you
          person_ids: ["P_ANNA", "P_BEN"]
