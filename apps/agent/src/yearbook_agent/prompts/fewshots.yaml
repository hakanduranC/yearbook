- locale: tr
  scope: global
  user: hangi etkinlikte en çok fotoğrafım var?
  steps:
    - tool: run_query
      args:
        sql: >-
          select e.title, count(*) as n from v_media m join v_events e on e.id = m.event_id
          join v_faces f on f.media_id = m.id join v_persons p on p.id = f.person_id
          where p.is_me group by e.title order by n desc limit 1
    - tool: present
      args:
        understood: En çok fotoğrafının olduğu etkinlik
        result: { kind: stat, title: En çok fotoğrafın olduğu etkinlik, value: Yaz pikniği, detail: 58 fotoğraf }
