# Few-shot examples rendered into the system prompt. Ids are placeholders; the model must use
# ids from real tool results. Keep this list between 6 and 10 entries, all three locales.
- locale: en
  scope: event
  user: photos of me and Anna
  steps:
    - tool: resolve_people
      args: { names: ["Anna"] }
      note: returns Anna = P_ANNA
    - tool: search_media
      args: { me: true, people_all: ["P_ANNA"], order_by: recent, limit: 60 }
      note: 14 ids
    - tool: present
      args:
        understood: Photos with you and Anna
        result:
          kind: media
          title: You and Anna
          media_ids: ["..."]
          group_by: time
          refine:
            - { label: Only the best, text: only the best photos of me and Anna }
            - { label: Evening, text: photos of me and Anna in the evening }
