- locale: en
  scope: event
  user: chart of uploads per hour
  steps:
    - tool: run_query
      args: { sql: "select date_trunc('hour', captured_at) as h, count(*) as n from v_media group by h order by h" }
    - tool: run_python
      args:
        code: "import json, matplotlib; matplotlib.use('Agg'); import matplotlib.pyplot as plt\ninp = json.load(open('/work/inputs.json'))\nxs = [r[0][11:16] for r in inp['rows']]; ys = [r[1] for r in inp['rows']]\nplt.figure(figsize=(8,3)); plt.bar(xs, ys); plt.tight_layout(); plt.savefig('/work/out/uploads.png')\nprint(json.dumps({'total': sum(ys), 'peak': xs[ys.index(max(ys))]}))"
        inputs: { rows: ["..."] }
    - tool: present
      args:
        understood: Uploads per hour as a chart
        result: { kind: stat, title: Uploads per hour, value: 412 photos, detail: Peak at 21:00 }
