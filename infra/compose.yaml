# Dev services only. The API, worker and web app run on the host via mise.
name: yearbook

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    shm_size: 1g
    environment:
      POSTGRES_USER: yearbook
      POSTGRES_PASSWORD: yearbook
      POSTGRES_DB: yearbook
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yearbook -d yearbook"]
      interval: 3s
      timeout: 3s
      retries: 20

  s3:
    # SeaweedFS single node with the S3 gateway. MinIO is discontinued.
    image: chrislusf/seaweedfs:latest
    command: >
      server -dir=/data -ip=s3 -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=1024 -volume.max=50
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      -s3.allowedOrigins=http://localhost:3000,http://localhost:8000
    ports: ["8333:8333"]
    volumes:
      - s3data:/data
      - ./s3/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8333/ >/dev/null 2>&1 || wget -qO- http://localhost:8333/status >/dev/null 2>&1 || exit 0"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3-init:
    image: amazon/aws-cli:2.33.0
    depends_on:
      s3:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: yearbook
      AWS_SECRET_ACCESS_KEY: yearbooksecret
      AWS_DEFAULT_REGION: us-east-1
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    volumes:
      - ./s3/init.sh:/init.sh:ro
      - ./s3/cors.json:/cors.json:ro
    entrypoint: ["/bin/sh", "/init.sh"]

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports: ["1025:1025", "8025:8025"]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  caddy:
    # Optional reverse proxy for testing SSE and cookies through one origin: http://localhost:8000
    profiles: ["proxy"]
    image: caddy:2.11.4
    ports: ["8000:8000"]
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ---------------------------------------------------------------------------
  # Full stack in containers: `docker compose --profile app up --build`
  # Everything is served through the gateway at http://localhost:8000
  # ---------------------------------------------------------------------------
  migrate:
    profiles: ["app"]
    build: { context: .., dockerfile: apps/api/Dockerfile }
    entrypoint: ["/app/ybctl", "migrate"]
    environment: &app_env
      DATABASE_URL: postgres://yearbook:yearbook@postgres:5432/yearbook?sslmode=disable
      S3_ENDPOINT: http://s3:8333
      S3_PRESIGN_ENDPOINT: http://localhost:8333
      S3_REGION: us-east-1
      S3_ACCESS_KEY: yearbook
      S3_SECRET_KEY: yearbooksecret
      S3_FORCE_PATH_STYLE: "true"
      S3_BUCKET_PRIVATE: yearbook-private
      S3_BUCKET_PUBLIC: yearbook-public
      PUBLIC_BASE_URL: http://localhost:8333/yearbook-public
      API_ADDR: ":8080"
      WEB_ORIGIN: http://localhost:8000
      ALLOWED_ORIGINS: http://localhost:8000
      COOKIE_SECURE: "false"
      SESSION_SECRET: compose-only-change-me-32-bytes-minimum!!
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: "Yearbook <hello@yearbook.local>"
      ML_URL: http://ml:8090
      AGENT_URL: http://agent:8091
      SANDBOX_URL: http://sandbox:8092
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-yearbook}
      MCP_URL: http://api:8080/mcp
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-demo@yearbook.local}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:-agent-ro-dev}
      HF_HOME: /models/hf
      INSIGHTFACE_HOME: /models/insightface
      WORKER_TAGS_ENABLED: ${WORKER_TAGS_ENABLED:-true}
    depends_on:
      postgres: { condition: service_healthy }

  api:
    profiles: ["app"]
    build: { context: .., dockerfile: apps/api/Dockerfile }
    environment: *app_env
    volumes:
      - ../apps/worker/fixtures:/fixtures:ro   # for `ybctl seed --fixtures /fixtures`
    depends_on:
      migrate: { condition: service_completed_successfully }
      s3-init: { condition: service_completed_successfully }
      mailpit: { condition: service_started }
    ports: ["8080:8080"]

  worker:
    # light pipeline: variants, hashes, dedupe, imports
    profiles: ["app"]
    build: { context: ../apps/worker }
    command: ["run", "--kinds", "ingest,import,recompute_scores", "--concurrency", "2"]
    environment: *app_env
    depends_on:
      migrate: { condition: service_completed_successfully }
      s3-init: { condition: service_completed_successfully }

  ml-worker:
    # faces, embeddings, quality, tags, age, clustering. Models download on first run into the models volume.
    profiles: ["app"]
    build: { context: ../apps/worker }
    command: ["run", "--kinds", "analyze,cluster_event", "--concurrency", "1"]
    environment: *app_env
    volumes: [models:/models]
    deploy:
      resources:
        limits: { memory: 8g }
    depends_on:
      migrate: { condition: service_completed_successfully }
      s3-init: { condition: service_completed_successfully }

  ml:
    # text embeddings for search (SigLIP 2 text tower)
    profiles: ["app"]
    build: { context: ../apps/worker }
    command: ["serve", "--port", "8090"]
    environment: *app_env
    volumes: [models:/models]
    expose: ["8090"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    profiles: ["app"]
    build: { context: .., dockerfile: apps/web/Dockerfile }
    environment:
      API_INTERNAL_URL: http://api:8080/api/v1
      PUBLIC_WEB_ORIGIN: http://localhost:8000
    depends_on:
      api: { condition: service_started }

  agent:
    # LangGraph chat agent; talks to the API's MCP tools and OpenAI
    profiles: ["app"]
    build: { context: ../apps/agent }
    environment: *app_env
    expose: ["8091"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  sandbox:
    # The only service that may start containers. Runs agent-written code in throwaway,
    # network-less containers. Needs the Docker socket; in production use gVisor (SANDBOX_RUNTIME=runsc).
    profiles: ["app"]
    build: { context: ../apps/sandbox }
    environment:
      <<: *app_env
      SANDBOX_WORK_DIR: /var/lib/yearbook-sandbox
      SANDBOX_IMAGE: yearbook-sandbox:latest
    # Runs as root inside its own container because it needs the Docker socket and must create
    # run directories the daemon can bind-mount. The work dir is bound at the same path on host and
    # container because paths handed to the daemon are host paths.
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sandboxwork:/var/lib/yearbook-sandbox
    expose: ["8092"]

  gateway:
    profiles: ["app"]
    image: caddy:2.11.4
    ports: ["8000:8000"]
    volumes:
      - ./caddy/Caddyfile.app:/etc/caddy/Caddyfile:ro
    depends_on: [api, web]

volumes:
  pgdata:
  s3data:
  models:
  sandboxwork:
