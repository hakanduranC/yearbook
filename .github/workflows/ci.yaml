name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: yearbook
          POSTGRES_PASSWORD: yearbook
          POSTGRES_DB: yearbook
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U yearbook" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://yearbook:yearbook@localhost:5432/yearbook?sslmode=disable
      TEST_DATABASE_URL: postgres://yearbook:yearbook@localhost:5432/yearbook_test?sslmode=disable
      WORKER_TEST_DATABASE_URL: postgres://yearbook:yearbook@localhost:5432/yearbook_test_worker?sslmode=disable
      AGENT_DB_PASSWORD: agent-ro-dev
      S3_ENDPOINT: http://localhost:8333
      S3_REGION: us-east-1
      S3_ACCESS_KEY: yearbook
      S3_SECRET_KEY: yearbooksecret
      S3_FORCE_PATH_STYLE: "true"
      S3_BUCKET_PRIVATE: yearbook-private
      S3_BUCKET_PUBLIC: yearbook-public
      PUBLIC_BASE_URL: http://localhost:8333/yearbook-public
      API_ADDR: ":8080"
      WEB_ORIGIN: http://localhost:3000
      ALLOWED_ORIGINS: http://localhost:3000
      COOKIE_SECURE: "false"
      SESSION_SECRET: ci-only-secret-at-least-32-bytes-long!!
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_FROM: "Yearbook <ci@yearbook.local>"
      API_INTERNAL_URL: http://localhost:8080/api/v1
      PUBLIC_WEB_ORIGIN: http://localhost:3000
      ML_URL: http://localhost:8090
      AGENT_URL: http://localhost:8091
      MCP_URL: http://localhost:8080/mcp
      SANDBOX_URL: http://localhost:8092
      SANDBOX_WORK_DIR: /tmp/yearbook-sandbox
      HF_HOME: /tmp/hf
      INSIGHTFACE_HOME: /tmp/insightface
      CI: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Start SeaweedFS (S3) and create buckets
        run: |
          docker run -d --name s3 -p 8333:8333 \
            -v "$PWD/infra/s3/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:latest server -dir=/data -ip.bind=0.0.0.0 \
            -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json \
            -s3.allowedOrigins=http://localhost:3000
          sed 's#http://s3:8333#http://localhost:8333#' infra/s3/init.sh > /tmp/init.sh
          docker run --rm --network host \
            -e AWS_ACCESS_KEY_ID=yearbook -e AWS_SECRET_ACCESS_KEY=yearbooksecret -e AWS_DEFAULT_REGION=us-east-1 \
            -e AWS_REQUEST_CHECKSUM_CALCULATION=when_required -e AWS_RESPONSE_CHECKSUM_VALIDATION=when_required \
            -v /tmp/init.sh:/init.sh:ro -v "$PWD/infra/s3/cors.json:/cors.json:ro" \
            --entrypoint /bin/sh amazon/aws-cli:2.33.0 /init.sh

      - name: Create test databases and migrate
        run: |
          docker run --rm --network host postgres:16 psql "$DATABASE_URL" -c 'create database yearbook_test'
          docker run --rm --network host postgres:16 psql "$DATABASE_URL" -c 'create database yearbook_test_worker'
          for url in "$DATABASE_URL" "$TEST_DATABASE_URL" "$WORKER_TEST_DATABASE_URL"; do
            goose -dir infra/migrations postgres "$url" up
          done

      - name: Install JS workspace
        run: pnpm install --frozen-lockfile

      - name: Sync Python apps
        run: |
          (cd apps/worker && uv sync --frozen)
          (cd apps/agent && uv sync --frozen)
          (cd apps/sandbox && uv sync --frozen)

      - name: Build the sandbox runtime image
        run: sh apps/sandbox/image/build.sh

      - name: Generated code is up to date
        run: |
          mise run gen
          git diff --exit-code -- apps/api/internal/gen packages/openapi/ts

      - name: Lint
        run: mise run lint

      - name: Install ffmpeg (worker video tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && ffmpeg -version | head -1

      - name: Tests · API (Go, real Postgres + S3)
        run: cd apps/api && go test ./... -count=1 -short

      - name: Tests · worker (no ML models)
        run: cd apps/worker && uv run pytest -q -m 'not ml'

      - name: Tests · agent service
        run: cd apps/agent && uv run pytest -q

      - name: Tests · sandbox (real Docker)
        run: cd apps/sandbox && uv run pytest -q

      - name: Tests · web (Vitest)
        run: cd apps/web && pnpm test

      - name: Browser tests (mock API)
        run: |
          (cd apps/web && pnpm exec playwright install --with-deps chromium)
          mise run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  images:
    # Proves every container image builds; runs after the test job on main.
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        run: docker compose -f infra/compose.yaml --profile app build api web worker agent sandbox
